<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador de Palabras</title>
<style>
    body{
        font-family: Arial, sans-serif;
        background:#121212;
        color:#fff;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:20px;
    }
    textarea{
        width:90%;
        height:250px;
        margin-top:10px;
        background:#1e1e1e;
        color:#00ffcc;
        border:2px solid #00ffcc;
        border-radius:10px;
        padding:10px;
        font-size:14px;
        resize:none;
    }
    button{
        margin-top:15px;
        padding:10px 20px;
        font-size:16px;
        border:none;
        border-radius:8px;
        background:#00ffcc;
        cursor:pointer;
        font-weight:bold;
    }
    h2,h3{
        margin-top:15px;
        color:#00ffcc;
    }
    .box{
        margin-top:10px;
        width:90%;
        background:#1e1e1e;
        border:1px solid #00ffcc;
        border-radius:8px;
        padding:10px;
        font-size:14px;
    }
</style>
</head>
<body>

<h1>📊 Contador de palabras dentro de comillas</h1>

<p>Pega aquí tu código 👇</p>

<textarea id="inputText">
// Ejemplo:
const words = [
"Playa","Escuela","Pizza","Futbol","Pizza","Playa"
];
</textarea>

<button onclick="contar()">Contar 🔍</button>

<h2 id="resultado">Total: 0</h2>

<h3>📋 Palabras encontradas:</h3>
<div id="lista" class="box"></div>

<h3>🔁 Palabras repetidas:</h3>
<div id="repetidas" class="box"></div>

<script>
function contar(){
    const texto = document.getElementById("inputText").value;
    
    // Extraer palabras dentro de comillas
    const matches = texto.match(/"([^"]+)"/g);
    
    const resultado = document.getElementById("resultado");
    const lista = document.getElementById("lista");
    const repetidas = document.getElementById("repetidas");
    
    if(!matches){
        resultado.innerText = "Total: 0 palabras ❌";
        lista.innerText = "";
        repetidas.innerText = "";
        return;
    }
    
    // Limpiar comillas
    const palabras = matches.map(p => p.replace(/"/g,""));
    
    // Contar total
    resultado.innerText = "Total: " + palabras.length + " palabras ✅";
    
    // Mostrar lista
    lista.innerText = palabras.join(", ");
    
    // Contar repeticiones
    const conteo = {};
    palabras.forEach(p => {
        conteo[p] = (conteo[p] || 0) + 1;
    });
    
    // Filtrar solo repetidas
    const duplicadas = Object.entries(conteo)
        .filter(([palabra, cantidad]) => cantidad > 1);
    
    if(duplicadas.length === 0){
        repetidas.innerText = "No hay palabras repetidas 🎉";
    } else {
        repetidas.innerHTML = duplicadas
            .map(([palabra, cantidad]) => `🔹 ${palabra} → ${cantidad} veces`)
            .join("<br>");
    }
}
</script>

</body>
</html>
