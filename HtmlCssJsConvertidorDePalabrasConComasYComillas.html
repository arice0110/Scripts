<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formateador de Palabras</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#121212;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}
textarea{
    width:95%;
    height:250px;
    background:#1e1e1e;
    color:#00ffcc;
    border:2px solid #00ffcc;
    border-radius:10px;
    padding:10px;
    font-size:14px;
    resize:none;
    margin-top:10px;
}
button{
    margin-top:12px;
    padding:10px 20px;
    font-size:15px;
    border:none;
    border-radius:8px;
    background:#00ffcc;
    cursor:pointer;
    font-weight:bold;
}
.box{
    margin-top:15px;
    width:95%;
    background:#1e1e1e;
    border:1px solid #00ffcc;
    border-radius:8px;
    padding:10px;
    font-size:14px;
    white-space:pre-wrap;
    word-break:break-word;
}
h2{color:#00ffcc;}
</style>
</head>
<body>

<h1>🧩 Formateador de Lista de Palabras</h1>

<p>Pega TODAS tus palabras aquí 👇  
(Puedes separarlas con comas, espacios o saltos de línea)</p>

<textarea id="entrada">
Playa, Escuela, Pizza, Futbol, Telefono
Montana Cine Helado Parque Balon
</textarea>

<button onclick="procesar()">Formatear ✨</button>
<button onclick="copiar()">Copiar 📋</button>

<h2 id="info"></h2>
<div id="salida" class="box"></div>

<script>
function procesar(){
    const texto = document.getElementById("entrada").value;
    const info = document.getElementById("info");
    const salida = document.getElementById("salida");

    // Separar por comas, saltos de línea o espacios
    let palabras = texto
        .replace(/[\r\n]+/g," ")
        .split(/[, ]+/)
        .map(p => p.trim())
        .filter(p => p.length > 0);

    if(palabras.length === 0){
        info.innerText = "❌ No se encontraron palabras";
        salida.innerText = "";
        return;
    }

    // Eliminar duplicadas
    palabras = [...new Set(palabras)];

    // Ordenar alfabéticamente
    palabras.sort((a,b)=>a.localeCompare(b,"es"));

    info.innerText = `✅ ${palabras.length} palabras procesadas sin repetir`;

    // Formato final
    let resultado = "const words = [\n";
    resultado += palabras.map(p => `"${p}"`).join(",");
    resultado += "\n];";

    salida.innerText = resultado;
}

function copiar(){
    const salida = document.getElementById("salida");
    if(!salida.innerText) return;
    navigator.clipboard.writeText(salida.innerText);
    alert("📋 Copiado al portapapeles!");
}
</script>

</body>
</html>
