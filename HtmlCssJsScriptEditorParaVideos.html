<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Studio Mobile - AutoWriter</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --sidebar-bg: #252526;
            --accent: #007acc;
            --text: #d4d4d4;
            --green: #4caf50;
        }

        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; 
            background: var(--bg-color); 
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh; overflow: hidden;
        }

        /* --- PANTALLA DE CONFIGURACIÓN --- */
        #setup-screen {
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100%;
            background: #2d2d2d;
            z-index: 200;
            position: absolute;
            width: 100%;
        }

        h2 { color: white; margin-bottom: 10px; font-size: 1.2rem; }
        
        textarea {
            flex: 1;
            background: #1e1e1e;
            color: #9cdcfe;
            border: 1px solid #444;
            padding: 15px;
            font-family: 'Fira Code', monospace;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-main {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* --- MODO EDITOR (OCULTO AL INICIO) --- */
        #editor-screen {
            display: none;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        #run-btn {
            position: fixed;
            top: 15px; right: 15px;
            z-index: 100;
            padding: 8px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 3px;
            font-weight: 600;
            font-size: 13px;
        }

        #run-btn.active { background: var(--green); }

        .editor-layout {
            display: flex;
            height: 100%;
            padding-top: 50px;
        }

        .code-viewer {
            flex: 1;
            overflow-y: auto;
            counter-reset: line;
            background: var(--bg-color);
        }

        .line {
            display: flex;
            min-height: 22px;
            line-height: 22px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .line::before {
            counter-increment: line;
            content: counter(line);
            width: 40px;
            background: var(--sidebar-bg);
            color: #858585;
            text-align: right;
            padding-right: 12px;
            margin-right: 10px;
            flex-shrink: 0;
            user-select: none;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: #52a1ff;
            margin-left: 2px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .hidden-input { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Configura tu Script</h2>
        <p style="color: #888; font-size: 0.9rem;">Pega aquí el código que se escribirá solo:</p>
        <textarea id="source-text" placeholder="Escribe o pega aquí tu código HTML/CSS/JS..."></textarea>
        <button class="btn-main" onclick="startEditor()">Continuar al Editor</button>
    </div>

    <div id="editor-screen">
        <button id="run-btn" onclick="this.classList.add('active')">RUN</button>
        <input type="text" id="fake-input" class="hidden-input">
        
        <div class="editor-layout" onclick="initTyping()">
            <div id="code-viewer" class="code-viewer">
                </div>
        </div>
    </div>

    <script>
        const setupScreen = document.getElementById('setup-screen');
        const editorScreen = document.getElementById('editor-screen');
        const sourceTextArea = document.getElementById('source-text');
        const viewer = document.getElementById('code-viewer');
        
        let contentToType = "";
        let currentIndex = 0;
        let isTyping = false;

        function startEditor() {
            contentToType = sourceTextArea.value;
            if (!contentToType.trim()) {
                alert("Por favor, ingresa algún texto primero.");
                return;
            }
            setupScreen.style.display = 'none';
            editorScreen.style.display = 'block';
            renderView(""); // Inicia vacío
        }

        function renderView(text) {
            const lines = text.split('\n');
            viewer.innerHTML = '';
            
            lines.forEach((lineText, idx) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'line';
                
                const contentSpan = document.createElement('span');
                contentSpan.innerText = lineText;
                
                lineDiv.appendChild(contentSpan);

                // Solo poner el cursor en la última línea
                if (idx === lines.length - 1) {
                    const cursor = document.createElement('span');
                    cursor.className = 'cursor';
                    lineDiv.appendChild(cursor);
                }
                
                viewer.appendChild(lineDiv);
            });

            // Scroll automático al final
            viewer.scrollTop = viewer.scrollHeight;
        }

        function initTyping() {
            if (isTyping) return;
            isTyping = true;
            typeEffect();
        }

        function typeEffect() {
            if (currentIndex < contentToType.length) {
                // Escribe de 1 a 3 caracteres para que se vea más natural
                let speed = Math.random() * 50 + 30; 
                let nextChars = contentToType.substring(0, currentIndex + 1);
                
                renderView(nextChars);
                currentIndex++;
                
                setTimeout(typeEffect, speed);
            }
        }
    </script>
</body>
          </html>
