<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Code Editor</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --neon-orange: #f2994a;
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            font-family: 'Orbitron', sans-serif; /* Fuente futurista */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 1.5rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Contenedor Grid Responsivo */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1400px;
            padding: 40px 0;
            justify-items: center;
        }

        /* El Cuadrado Perfecto */
        .editor-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px; /* Tamaño máximo del cuadro */
            aspect-ratio: 1 / 1; /* Esto obliga a que sea un cuadrado perfecto */
            position: relative;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .editor-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Encabezado del cuadro */
        .card-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Estilo para el área de texto */
        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #ccc;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            resize: none;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }

        /* Colores Neón por tipo */
        .html-card { border-top: 4px solid var(--neon-orange); box-shadow: 0 0 15px rgba(242, 153, 74, 0.2); }
        .css-card { border-top: 4px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        .js-card { border-top: 4px solid var(--neon-purple); box-shadow: 0 0 15px rgba(157, 80, 187, 0.2); }

        .html-card .card-header { color: var(--neon-orange); }
        .css-card .card-header { color: var(--neon-blue); }
        .js-card .card-header { color: var(--neon-purple); }

        /* Adaptación para móviles muy pequeños */
        @media (max-width: 400px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            .editor-card {
                max-width: 90vw;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <h1>Core System Editor</h1>

    <div class="grid-container">
        <div class="editor-card html-card">
            <div class="card-header">STRUCTURE.HTML</div>
            <textarea spellcheck="false" placeholder="<write_code_here>"></textarea>
        </div>

        <div class="editor-card css-card">
            <div class="card-header">DESIGN.CSS</div>
            <textarea spellcheck="false" placeholder="/* define_styles_here */"></textarea>
        </div>

        <div class="editor-card js-card">
            <div class="card-header">LOGIC.JS</div>
            <textarea spellcheck="false" placeholder="// execute_logic_here"></textarea>
        </div>
    </div>

</body>
</html>
